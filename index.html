<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>库存分析BI看板 · 第一层战略总览</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body data-layer="layer1">
    <div class="app-shell">
      <header class="site-header panel">
        <div class="site-header__top site-header__top--layer1">
          <div class="site-header__brand">
            <h1>库存分析BI看板</h1>
            <p class="site-header__summary">第一层 · 库存战略总览</p>
          </div>
          <div class="site-header__meta">
            <span class="pill pill-muted">数据更新时间 <strong class="js-updated-at">--</strong></span>
          </div>
        </div>
        <nav class="layer-nav" aria-label="层级导航">
          <a href="./index.html" data-nav="layer1">库存战略总览</a>
          <a href="./layer-2.html" data-nav="layer2">结构分析</a>
          <a href="./layer-3.html" data-nav="layer3">预警与补货</a>
          <a href="./layer-4.html" data-nav="layer4">诊断与模拟</a>
        </nav>
      </header>

      <main class="page-stack">
        <section class="toolbar panel js-toolbar" aria-label="筛选区"></section>

        <section class="kpi-group-stack js-kpi-groups" aria-label="核心指标卡"></section>

        <section class="overview-grid">
          <article class="panel panel-spotlight">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">整体健康仪表盘</p>
                <h3>库存健康度评分</h3>
              </div>
              <span class="pill pill-primary">战略总分</span>
            </div>
            <div class="score-panel">
              <div class="score-stage js-health-score-chart" aria-hidden="true"></div>
              <div class="score-details">
                <p class="score-summary js-health-score-summary">--</p>
                <div class="score-factors js-health-score-factors"></div>
              </div>
            </div>
          </article>

          <article class="panel panel-risk-warning js-risk-panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">关键风险预警</p>
                <h3>库存风险评级（按品类）</h3>
              </div>
              <span class="pill pill-warning">高 / 中 / 低风险</span>
            </div>
            <div class="risk-rating-list js-risk-rating-list"></div>
          </article>
        </section>

        <section class="trend-grid">
          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">趋势对照</p>
                <h3>出库量 vs 入库量（近3个月）</h3>
              </div>
              <div class="panel-switch js-outbound-scope-switch" aria-label="出入库趋势口径切换"></div>
            </div>
            <div class="chart-stage js-outbound-inbound-chart"></div>
          </article>

          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">库存余额</p>
                <h3>库存余额趋势（近3个月）</h3>
              </div>
              <div class="panel-switch js-balance-scope-switch" aria-label="库存余额趋势口径切换"></div>
            </div>
            <div class="chart-stage js-balance-chart"></div>
          </article>
        </section>

        <section class="single-panel-grid">
          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">关键风险预警</p>
                <h3>呆滞库存分析</h3>
              </div>
              <div class="panel-switch js-stagnant-sort-switch" aria-label="呆滞分析排序切换"></div>
            </div>
            <div class="stagnant-grid">
              <article class="stagnant-table-card">
                <h4>Top10 品类</h4>
                <div class="rank-table js-stagnant-category"></div>
              </article>
              <article class="stagnant-table-card">
                <h4>Top10 仓库</h4>
                <div class="rank-table js-stagnant-warehouse"></div>
              </article>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/charts/overview.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
